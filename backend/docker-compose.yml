name: naseeji-platform

services:
  # 1. MongoDB 8 Database Container with Authentication
  mongodb:
    image: mongo:8.0
    container_name: naseeji-mongodb
    restart: always
    ports:
      - "27017:27017" # Accessible externally by MongoDB Compass / Keeper GUI
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: naseeji
    volumes:
      - mongo_data:/data/db
    networks:
      - naseeji-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username admin --password admin123 --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Redis 7 In-Memory Cache & Session Store Container
  redis:
    image: redis:7.4-alpine
    container_name: naseeji-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    networks:
      - naseeji-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis123 ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 3. MinIO S3 Compatible Object Storage Container
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-08Z
    container_name: naseeji-minio
    restart: always
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - naseeji-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 4. NASEEJI Node.js Backend Application Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: naseeji-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/naseeji?authSource=admin
      REDIS_URL: redis://:redis123@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: naseeji-uploads
      JWT_SECRET: naseeji-enterprise-super-secret-jwt-key-2026
      JWT_REFRESH_SECRET: naseeji-enterprise-super-secret-refresh-key-2026
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:5000/api/v1
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - naseeji-network

  # 5. Mongo Express Web Administration GUI
  mongo-express:
    image: mongo-express:latest
    container_name: naseeji-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - naseeji-network

  # 6. Mailpit Developer Web & SMTP Server
  mailpit:
    image: axllent/mailpit:latest
    container_name: naseeji-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - naseeji-network

networks:
  naseeji-network:
    name: naseeji-network
    driver: bridge

volumes:
  mongo_data:
    name: naseeji_mongo_data
  redis_data:
    name: naseeji_redis_data
  minio_data:
    name: naseeji_minio_data
