version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/naseeji_dev
    depends_on:
      - mongodb
    networks:
      - naseeji-network

  mongodb:
    image: mongo:7.0
    container_name: naseeji-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - naseeji-network

networks:
  naseeji-network:
    driver: bridge

volumes:
  mongo_data:
