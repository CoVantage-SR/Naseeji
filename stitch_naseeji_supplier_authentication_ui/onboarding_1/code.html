<style>
        body {

        .material-symbols-outlined {

        }
        .onboarding-image-container {
            border-radius: 0 0 48px 48px;

        }
        .page-indicator-dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }

<script>
        // Micro-interaction: Active indicator pulsing effect
        const dots = document.querySelectorAll('.page-indicator-dot');
        let currentActive = 0;

        // Simple script to simulate a light animation for the primary button
        document.querySelector('button.bg-primary').addEventListener('mouseenter', function() {
            this.style.boxShadow = '0 15px 30px rgba(0, 64, 224, 0.3)';
        });
        document.querySelector('button.bg-primary').addEventListener('mouseleave', function() {
            this.style.boxShadow = '0 10px 20px rgba(0, 64, 224, 0.2)';
        });

        // Toggle dark mode support (optional interaction)
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
