<style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background-color: #fbf8ff;
            color: #191b24;
            overflow-x: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .step-active {
            width: 24px;
            background-color: #0040e0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .step-inactive {
            width: 8px;
            background-color: #c4c5d9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between bg-surface selection:bg-primary/20">
<!-- Top AppBar (Simplified for Onboarding) -->
<header class="w-full top-0 sticky z-50 bg-surface/80 backdrop-blur-md shadow-sm h-16 flex items-center justify-between px-margin-mobile md:px-margin-desktop rtl">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md font-bold text-primary">Naseeji</span>
</div>
<button class="text-on-surface-variant font-label-lg px-4 py-2 hover:bg-surface-container-high rounded-full transition-colors">
            تخطي
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-max-width flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-8">
<!-- Animated Image Container -->
<div class="relative w-full max-w-lg mb-12 transform hover:scale-[1.02] transition-transform duration-700 ease-out">
<!-- Background Decorative Element -->
<div class="absolute -top-10 -right-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl -z-10 animate-pulse"></div>
<div class="absolute -bottom-10 -left-10 w-48 h-48 bg-secondary/5 rounded-full blur-3xl -z-10 animate-pulse" style="animation-delay: 1s;"></div>
<!-- Featured Image -->
<div class="relative rounded-3xl overflow-hidden shadow-2xl bg-white aspect-[3/4]">
<img alt="Business Growth Dashboard Overview" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqHQvVVmEEq1Y_lLH9lM5ZOWTbR9EgG7PGxsU-b4sAHq7Wip2E4nKk9UzbPbPDMjukEtQupp_QOJGesSO-9qEzmlZh-78Kyb2LTogXXT41tFDDLOTMwKKh6naJknmA2-yhbBMvzKiUcLLJNaEU0VZcwkKuBs5ZWl-8I1qqvXfL9nBoP1mfjsDfI0K6QhIorwiAR5DphGFew50REyd6yj3oBf1TPTl1hhh8wx0ORPtppAQqoqac5KD7hXD3GzBuQXYWxh6KrL86kbE"/>
<!-- Floating Glass Card Overlay (Interactive Feel) -->
<div class="absolute bottom-6 left-6 right-6 glass-card p-4 rounded-2xl flex items-center justify-between shadow-xl animate-bounce" style="animation-duration: 3s;">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined">trending_up</span>
</div>
<div>
<p class="font-label-sm text-label-sm-mobile text-on-surface-variant">النمو السنوي</p>
<p class="font-title-md text-title-md text-on-surface">+24.8%</p>
</div>
</div>
<div class="flex -space-x-2 rtl:space-x-reverse">
<div class="w-8 h-8 rounded-full border-2 border-surface bg-primary-fixed"></div>
<div class="w-8 h-8 rounded-full border-2 border-surface bg-secondary-fixed"></div>
<div class="w-8 h-8 rounded-full border-2 border-surface bg-tertiary-fixed flex items-center justify-center text-[10px] font-bold">+5</div>
</div>
</div>
</div>
</div>
<!-- Textual Content -->
<div class="text-center space-y-6 max-w-md px-4">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight leading-tight">
                إدارة أعمالك بالكامل
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed opacity-90">
                تابع الشحنات والأرباح والفواتير والعملاء من لوحة تحكم واحدة ذكية ومترابطة.
            </p>
</div>
<!-- Page Indicator -->
<div class="flex items-center justify-center gap-2 mt-10">
<div class="h-2 step-inactive rounded-full"></div>
<div class="h-2 step-inactive rounded-full"></div>
<div class="h-2 step-active rounded-full"></div>
</div>
</main>
<!-- Fixed Bottom Navigation / Actions -->
<footer class="w-full max-w-max-width px-margin-mobile md:px-margin-desktop pb-12 pt-4">
<div class="flex flex-col-reverse md:flex-row items-center gap-4 w-full">
<!-- Secondary Action -->
<button class="w-full md:w-auto px-8 py-4 rounded-2xl border border-outline text-on-surface font-title-md hover:bg-surface-container-high active:scale-95 transition-all">
                السابق
            </button>
<!-- Primary Action -->
<button class="w-full flex-grow py-4 rounded-2xl bg-primary text-on-primary font-title-md shadow-lg shadow-primary/20 hover:shadow-xl hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-2">
<span>ابدأ الآن</span>
<span class="material-symbols-outlined text-[20px]">rocket_launch</span>
</button>
</div>
</footer>
<!-- Micro-interaction Scripts -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const primaryBtn = document.querySelector('button.bg-primary');
            primaryBtn.addEventListener('mouseenter', () => {
                const icon = primaryBtn.querySelector('.material-symbols-outlined');
                icon.style.transform = 'translateY(-2px) translateX(-2px)';
            });
            primaryBtn.addEventListener('mouseleave', () => {
                const icon = primaryBtn.querySelector('.material-symbols-outlined');
                icon.style.transform = 'none';
            });
        });
    </script>
</body></html>
