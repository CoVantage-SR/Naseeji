<script>
        // OTP Focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 0 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Timer Logic
        let timeLeft = 120;
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resendBtn');

        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.textContent = "00:00";
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-outline', 'cursor-not-allowed');
                resendBtn.classList.add('text-primary', 'cursor-pointer');
            } else {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                timeLeft--;
            }
        }, 1000);

        // Interaction for the primary button
        const verifyBtn = document.querySelector('button.bg-primary');
        verifyBtn.addEventListener('click', () => {
            verifyBtn.innerHTML = `<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>`;
            setTimeout(() => {
                verifyBtn.innerHTML = `<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>`;
                verifyBtn.classList.replace('bg-primary', 'bg-secondary');
            }, 1500);
        });
    </script>
