<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>

<style>
        body { font-family: 'IBM Plex Sans Arabic', 'IBM Plex Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-field:focus-within label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #0040e0;
            background-color: #fbf8ff;
            padding: 0 4px;
        }
        .form-field input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            background-color: #fbf8ff;
            padding: 0 4px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e1ef; border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- Background Decorative Shader -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-40">

</div>
<!-- Layout Container -->
<main class="relative z-10 flex min-h-screen items-center justify-center p-4 md:p-8">
<div class="w-full max-w-2xl bg-surface/80 backdrop-blur-xl border border-outline-variant shadow-xl rounded-3xl overflow-hidden flex flex-col md:flex-row min-h-[751px]">
<!-- Branding Section (Left/Top) -->
<div class="w-full md:w-2/5 p-8 flex flex-col justify-between bg-primary-container text-on-primary-container relative">
<div class="absolute inset-0 opacity-10 pointer-events-none">
<div class="w-full h-full" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 24px 24px;"></div>
</div>
<div class="relative z-10">
<h1 class="text-headline-lg font-bold tracking-tight">Naseeji</h1>
<p class="mt-2 text-body-md opacity-80 leading-relaxed">الرابط الذكي بين الموردين ومصانع النسيج المستقبلية.</p>
</div>
<div class="relative z-10 hidden md:block">
<div class="space-y-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-fixed">verified</span>
<span class="text-label-lg">موردين معتمدين</span>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-fixed">bolt</span>
<span class="text-label-lg">توريد ذكي وسريع</span>
</div>
</div>
</div>
<!-- Small Visual Element for context -->
<div class="relative z-10 mt-8 rounded-2xl overflow-hidden aspect-video shadow-lg border border-on-primary-fixed-variant/20">
<img class="w-full h-full object-cover" data-alt="High-end close up of luxury textile weaving machinery in a smart factory setting. The lighting is crisp and professional with deep blue and white tones, reflecting a modern industrial aesthetic. Soft bokeh highlights the intricate threads and metallic textures of the equipment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAhy7sCMnbCQ2UtMymxhfWcdWZxRQs-PujSbPqZRvfzmagdlY_FgLz10xvJWYGJ0t7PLiFfsGF5Mdu0MF6jkzqONk2giNjB6GYsSSNtcChbdgbHLWYOjrr0bWj1SBEE6uDxAgj0xfeiwRdkQOl2gqm1mJ7zb7keDCnImQU1pj02iq9tH3UbZrYhVSBhWJcuX0xP-issEaiS6t4P9DQVYycnDCKd4rTLT7v1P-m6pDMx5dPjN1iYCP9TBPphMl1HATfIi81gdy0ftm4"/>
</div>
</div>
<!-- Form Section (Right/Bottom) -->
<div class="w-full md:w-3/5 p-6 md:p-10 flex flex-col h-full max-h-[751px]">
<div class="mb-6">
<h2 class="text-headline-md font-bold text-primary">إنشاء حساب</h2>
<p class="text-on-surface-variant text-body-md mt-1">أدخل بيانات الشركة للبدء في رحلة التوريد الذكي</p>
</div>
<form class="flex-grow overflow-y-auto custom-scrollbar pr-1" id="registrationForm">
<div class="space-y-6">
<!-- Company & Manager -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" id="company_name" placeholder=" " type="text"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="company_name">اسم الشركة</label>
</div>
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" id="manager_name" placeholder=" " type="text"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="manager_name">اسم المسؤول</label>
</div>
</div>
<!-- Contact Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface text-left dir-ltr" id="email" placeholder=" " type="email"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="email">البريد الإلكتروني</label>
</div>
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface text-left dir-ltr" id="phone" placeholder=" " type="tel"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="phone">رقم الهاتف</label>
</div>
</div>
<!-- Location -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="relative form-field">
<select class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface appearance-none" id="country">
<option disabled="" selected="" value=""></option>
<option value="sa">المملكة العربية السعودية</option>
<option value="ae">الإمارات العربية المتحدة</option>
<option value="kw">الكويت</option>
</select>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="country">الدولة</label>
<span class="material-symbols-outlined absolute left-4 top-4 pointer-events-none text-outline">expand_more</span>
</div>
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" id="city" placeholder=" " type="text"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="city">المدينة</label>
</div>
</div>
<!-- Passwords -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface text-left" id="password" placeholder=" " type="password"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="password">كلمة المرور</label>
</div>
<div class="relative form-field">
<input class="peer w-full h-14 px-4 bg-transparent border border-outline rounded-xl outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface text-left" id="confirm_password" placeholder=" " type="password"/>
<label class="absolute right-4 top-4 text-on-surface-variant pointer-events-none transition-all origin-right" for="confirm_password">تأكيد كلمة المرور</label>
</div>
</div>
<!-- Terms -->
<label class="flex items-start gap-3 cursor-pointer group">
<div class="relative flex items-center mt-1">
<input class="peer h-5 w-5 rounded border-outline text-primary focus:ring-primary transition-all cursor-pointer" type="checkbox"/>
</div>
<span class="text-body-md text-on-surface-variant group-hover:text-on-surface transition-colors">
                                أوافق على <a class="text-primary font-bold hover:underline decoration-primary/30" href="#">الشروط والأحكام</a> وسياسة الخصوصية.
                            </span>
</label>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary font-bold rounded-2xl shadow-lg hover:shadow-primary/20 hover:scale-[1.01] active:scale-95 transition-all duration-300 flex items-center justify-center gap-2 group" type="submit">
                            إنشاء حساب
                            <span class="material-symbols-outlined group-hover:translate-x-[-4px] transition-transform">arrow_back</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-on-surface-variant text-label-lg">أو</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-12 border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors group" type="button">
<div class="w-5 h-5 flex items-center justify-center">
<img alt="Google" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA8JNOLAuuvCbgPWuYYBD3Gsn-gLwLDyW3x2X7n9XdxK-lPz0tvpj4HHwOPFPttUA0rosmhQDLoAuKuRs0V6aMncNUVBUhNow2LINWXRjvqV1vit01MHR_w4XrRQEPj7vTSz5NEPPa-tbuXQ4SFDVKEhrLG5K8g8uFDlYU0ueIsWi42K8tTZemtz8R7vhKOeDrKqBvALgiVcwNrwj47xkRtgmi4KSDzjxNnkSZVRJx-6R9M8lU__QobKVfdLeiMrTldlWHRDalr3FA"/>
</div>
<span class="text-label-lg font-medium">Google</span>
</button>
<button class="flex items-center justify-center gap-3 h-12 border border-outline-variant rounded-xl hover:bg-surface-container-low transition-colors group" type="button">
<span class="material-symbols-outlined text-on-surface text-[20px]" style="font-variation-settings: 'FILL' 1;">apps</span>
<span class="text-label-lg font-medium">Apple</span>
</button>
</div>
</div>
</form>
<!-- Footer -->
<div class="mt-auto pt-6 text-center">
<p class="text-body-md text-on-surface-variant">
                        لديك حساب بالفعل؟
                        <a class="text-primary font-bold hover:underline decoration-primary/30 mr-1" href="#">تسجيل الدخول</a>
</p>
</div>
</div>
</div>
</main>
<script>
        // Form field focus management for Material 3 labels
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('change', (e) => {
                if (e.target.value !== "") {
                    e.target.nextElementSibling.classList.add('scale-85', '-translate-y-6', 'bg-background', 'px-1');
                }
            });
        });

        // Simple smooth interaction for form submission
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span>`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> تمت العملية`;
                btn.classList.replace('bg-primary', 'bg-secondary');
            }, 1500);
        });
    </script>
</body></html>
