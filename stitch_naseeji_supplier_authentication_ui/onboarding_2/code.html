<button class="w-full h-14 border-2 border-outline text-on-surface-variant font-title-md text-title-md rounded-2xl flex items-center justify-center active:scale-[0.98] transition-transform hover:bg-surface-container-high">

                </button>
</div>

</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    let x = e.clientX - e.target.offsetLeft;
                    let y = e.clientY - e.target.offsetTop;
                    let ripples = document.createElement('span');
                    ripples.style.left = x + 'px';
                    ripples.style.top = y + 'px';
                    this.appendChild(ripples);
                    setTimeout(() => { ripples.remove() }, 600);
                });
            });
        });
    </script>
