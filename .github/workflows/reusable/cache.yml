name: Reusable Build Cache

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: 'naseeji_factory_supplier'

jobs:
  cache:
    name: Manage Build Caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-pub-
