name: Reusable Artifact Uploader

on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      artifact-path:
        type: string
        required: true
      retention-days:
        type: number
        required: false
        default: 7

jobs:
  upload:
    name: Upload Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.retention-days }}
