name: "Flutter Setup"
description: "Enterprise reusable Flutter setup action: Java JDK, Flutter SDK, Caching, and Pub Dependencies"

inputs:
  channel:
    description: "Flutter SDK channel (e.g. stable, beta)"
    required: false
    default: "stable"
  flutter-version:
    description: "Specific Flutter SDK version (optional)"
    required: false
    default: ""
  working-directory:
    description: "Directory containing pubspec.yaml"
    required: false
    default: "naseeji_factory_supplier"

runs:
  using: "composite"
  steps:
    - name: 1. Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 2. Set up Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

    - name: 3. Restore Pub Package Cache
      uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles(format('{0}/pubspec.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: 4. Install Pub Dependencies
      shell: bash
      run: flutter pub get
      working-directory: ${{ inputs.working-directory }}
