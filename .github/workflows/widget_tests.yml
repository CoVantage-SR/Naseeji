name: Widget Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: widget-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  widget-tests:
    name: Run Component Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/actions/flutter_setup
        with:
          flutter-version: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Run Component Widget Tests
        run: flutter test test/authentication/presentation/login/login_screen_test.dart test/widget_test.dart
