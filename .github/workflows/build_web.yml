name: Build Flutter Web

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  build-web:
    name: Compile Web Release Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/actions/flutter_setup
        with:
          flutter-version: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Compile Web Release Bundle
        run: flutter build web --release --base-href /Naseeji/ --tree-shake-icons

      - name: 4. Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-build
          path: naseeji_factory_supplier/build/web
          retention-days: 7
