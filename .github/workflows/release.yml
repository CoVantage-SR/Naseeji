name: Release Production Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: naseeji_factory_supplier

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/actions/flutter_setup
        with:
          flutter-version: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Build Release APK
        run: flutter build apk --release --tree-shake-icons

      - name: 4. Build Release AAB
        run: flutter build appbundle --release --tree-shake-icons

      - name: 5. Create GitHub Release & Attach Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            naseeji_factory_supplier/build/app/outputs/flutter-apk/app-release.apk
            naseeji_factory_supplier/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
