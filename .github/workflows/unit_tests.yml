name: Unit Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  unit-tests:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/actions/flutter_setup
        with:
          flutter-version: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Execute Unit Tests & Generate Coverage
        run: flutter test --coverage --exclude-tags golden

      - name: 4. Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: naseeji_factory_supplier/coverage/lcov.info
          retention-days: 7
