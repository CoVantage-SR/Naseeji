name: Release Android Assets

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  release-android:
    name: Build & Attach Release Assets (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/workflows/reusable/flutter_setup.yml
        with:
          channel: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Build Release APK
        run: flutter build apk --release

      - name: 4. Build Release App Bundle (AAB)
        run: flutter build appbundle --release

      - name: 5. Attach APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: |
            naseeji_factory_supplier/build/app/outputs/flutter-apk/app-release.apk
            naseeji_factory_supplier/build/app/outputs/bundle/release/app-release.aab
