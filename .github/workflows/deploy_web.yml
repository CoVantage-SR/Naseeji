name: Build & Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

# Set minimal required GITHUB_TOKEN permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments and cancel older running jobs on the same ref
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  # ---------------------------------------------------------
  # Job 1: Quality Assurance & Build
  # ---------------------------------------------------------
  build-and-test:
    name: Build & Test Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 3. Restore Pub Package Cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('naseeji_factory_supplier/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 4. Install Dependencies (flutter pub get)
        run: flutter pub get

      - name: 5. Analyze Code Structure (flutter analyze)
        run: flutter analyze

      - name: 6. Run Unit & Widget Tests (flutter test)
        run: flutter test

      - name: 7. Build Flutter Web Release (CanvasKit & Tree Shaking)
        run: flutter build web --release --web-renderer canvaskit --tree-shake-icons

      - name: 8. Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: naseeji_factory_supplier/build/web

  # ---------------------------------------------------------
  # Job 2: Deploy to GitHub Pages
  # ---------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 9. Deploy Build Artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
