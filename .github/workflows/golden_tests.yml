name: Golden Visual Tests

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  golden-tests:
    name: Run Golden Visual Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/actions/flutter_setup
        with:
          flutter-version: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Run Golden Visual Regression Tests
        run: flutter test test/authentication/presentation/login/login_screen_golden_test.dart

      - name: 4. Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: |
            naseeji_factory_supplier/test/**/failures/**/*
            naseeji_factory_supplier/test/**/*_test.png
          retention-days: 7
