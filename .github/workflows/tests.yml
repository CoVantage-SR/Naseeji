name: Unit, Widget & Golden Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: naseeji_factory_supplier

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Environment
        uses: ./.github/workflows/reusable/flutter_setup.yml
        with:
          channel: 'stable'
          working-directory: 'naseeji_factory_supplier'

      - name: 3. Run Unit, Widget & Golden Tests
        run: flutter test --coverage

      - name: 4. Upload Golden Test Failure Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-test-failures
          path: |
            naseeji_factory_supplier/test/**/failures/**/*
            naseeji_factory_supplier/test/**/*_test.png
            naseeji_factory_supplier/build/test_failures
          retention-days: 7
